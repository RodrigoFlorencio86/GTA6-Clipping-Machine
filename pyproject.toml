[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gta6-clipping-machine"
version = "0.1.0"
description = "Local-first app that indexes your own gameplay with EmbeddingGemma 2, finds moments by natural-language search and exports vertical clips for human review."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Rodrigo Florencio" }]
keywords = ["video", "clipping", "semantic-search", "embeddings", "embeddinggemma", "ffmpeg", "local-first"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "sentence-transformers>=6.1.0",
    "torch>=2.6",
    "torchvision>=0.21",
    "pillow>=10.0",
    "numpy>=1.26",
    "lancedb>=0.20",
    "pyarrow>=15.0",
    "scenedetect>=0.7",
    "streamlit>=1.40",
    "altair>=5.0",
    "pandas>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Burned-in subtitles: fully local transcription of the exported range.
subtitles = ["faster-whisper>=1.1"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
clipping-machine = "clipping_machine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clipping_machine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not model'"
markers = [
    "ffmpeg: needs the ffmpeg/ffprobe binaries on PATH",
    "model: loads the real EmbeddingGemma 2 (downloads ~1.5 GB the first time); run with -m model",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # pt-BR UI strings use "ambiguous" characters

[tool.ruff.lint.per-file-ignores]
"src/clipping_machine/ui/i18n.py" = ["E501"]  # long UI strings

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/clipping_machine"]
exclude = ["src/clipping_machine/ui/"]

[[tool.mypy.overrides]]
module = [
    "lancedb.*",
    "pyarrow.*",
    "scenedetect.*",
    "sentence_transformers.*",
    "faster_whisper.*",
    "torch.*",
    "PIL.*",
]
ignore_missing_imports = true
follow_imports = "skip"
