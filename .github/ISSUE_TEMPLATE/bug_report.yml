name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please do not attach gameplay you do not own, and remove personal
        paths or names from logs if you prefer.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `clipping-machine doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message or log
      render: text
  - type: input
    id: video
    attributes:
      label: Video details
      description: Container, resolution, frame rate and length (e.g. MKV, 1920x1080, 60 fps, 2 h)
  - type: dropdown
    id: hardware
    attributes:
      label: Hardware used by the model
      options:
        - CPU
        - NVIDIA GPU (CUDA)
        - Apple Silicon (MPS)
        - Other
