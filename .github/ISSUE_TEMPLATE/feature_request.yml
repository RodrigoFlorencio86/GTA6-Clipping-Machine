name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [roadmap](https://github.com/RodrigoFlorencio86/GTA6-Clipping-Machine/blob/main/docs/ROADMAP.md) first.
        Requests for URL downloading, automatic publishing, cloud processing or telemetry are out
        of scope by design (see docs/ACCEPTABLE_USE.md).
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could the app help?
  - type: checkboxes
    id: rules
    attributes:
      label: Project rules
      options:
        - label: This works with local files only and keeps a human in charge of publishing.
          required: true
